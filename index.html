<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>Conecta — Mensagens</title><style>
:root{--green:#075e54;--green2:#128c7e;--bg:#eae6df;--panel:#f0f2f5;--text:#202c33;--muted:#667781;--line:#d8dee2;--bubble:#fff;--out:#d9fdd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}.hidden{display:none!important}.app{height:100vh;display:flex;max-width:1500px;margin:auto;background:#fff}.login{margin:auto;width:min(400px,calc(100% - 28px));background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 45px #0002}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;margin-bottom:8px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#25d69b,#128c7e);color:#fff}.login p{color:var(--muted);font-size:12px;line-height:1.5}.tabs{display:flex;gap:5px;margin:19px 0 13px}.tabs button{flex:1;border:0;border-radius:9px;padding:10px;background:#edf1f2;color:var(--muted);font-weight:800}.tabs button.active{background:var(--green2);color:#fff}.login input{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:var(--green2);color:#fff;font-weight:900;margin-top:8px}.error{color:#c62828;font-size:11px;min-height:17px;margin-top:8px}.chats{width:370px;flex:0 0 370px;border-right:1px solid var(--line);display:flex;flex-direction:column}.top{height:60px;padding:10px 15px;background:var(--panel);display:flex;align-items:center;justify-content:space-between}.profile{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#78909c;color:#fff;font-weight:800}.avatar.green{background:#25a18e}.avatar.blue{background:#5684c4}.profile strong,.profile small{display:block}.profile strong{font-size:14px}.profile small{font-size:10px;color:var(--muted);margin-top:2px}.tools{display:flex;gap:3px}.icon{border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:50%}.search{margin:9px 12px;background:var(--panel);border-radius:9px;padding:9px 12px;display:flex;gap:8px}.search input{border:0;outline:0;background:transparent;flex:1;font-size:12px}.chat-list{overflow:auto}.chat-item{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #edf0f2;cursor:pointer}.chat-item:hover,.chat-item.active{background:#f0f2f5}.copy{min-width:0;flex:1}.line{display:flex;justify-content:space-between;gap:5px}.line strong{font-size:13px}.line time,.preview{font-size:10px;color:var(--muted)}.preview{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.conversation{flex:1;min-width:0;display:flex;flex-direction:column;background:#efeae2;background-image:radial-gradient(#d8d1c7 1px,transparent 1px);background-size:20px 20px}.conversation-top{height:60px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line)}.back{display:none}.conversation-top .profile{flex:1}.messages{flex:1;overflow:auto;padding:22px 7%;display:flex;flex-direction:column;gap:6px}.day{margin:2px auto 10px;background:#fff;color:var(--muted);font-size:10px;padding:6px 10px;border-radius:7px}.msg{max-width:62%;align-self:flex-start;background:var(--bubble);padding:7px 9px 5px;border-radius:7px;box-shadow:0 1px 1px #0002;font-size:13px;line-height:1.35}.msg.out{align-self:flex-end;background:var(--out)}.meta{float:right;color:var(--muted);font-size:9px;margin:7px 0 0 10px}.composer{min-height:61px;padding:10px 18px;display:flex;align-items:center;gap:8px;background:var(--panel)}.composer input{flex:1;border:0;border-radius:22px;padding:12px 15px;outline:0}.send{border:0;width:40px;height:40px;border-radius:50%;background:var(--green2);color:#fff;font-size:18px}.empty{text-align:center;color:var(--muted);font-size:12px;padding:30px}.account{margin-top:auto;border-top:1px solid var(--line);padding:12px 15px;color:var(--muted);font-size:11px}.search-users{padding:12px;border-bottom:1px solid var(--line)}.search-users input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.user-result{padding:10px 13px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px}.user-result:hover{background:#f0f2f5}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);opacity:0;background:#263238;color:#fff;padding:11px 15px;border-radius:8px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.chats{width:100%;flex:1}.conversation{display:none}.app.open-chat .chats{display:none}.app.open-chat .conversation{display:flex}.back{display:block}.messages{padding:18px 12px}.msg{max-width:82%}.composer{padding:8px 10px}}
</style></head><body><div id="login" class="login"><div class="brand"><span class="logo">◉</span>Conecta</div><p>Mensagens em tempo real, com contas e conversas privadas.</p><div class="tabs"><button id="loginTab" class="active" onclick="mode='login';toggleAuth()">Entrar</button><button id="registerTab" onclick="mode='register';toggleAuth()">Criar conta</button></div><input id="name" placeholder="Seu nome" class="hidden"><input id="username" placeholder="Usuário"><input id="password" type="password" placeholder="Senha"><div id="error" class="error"></div><button class="primary" onclick="auth()" id="authButton">Entrar</button></div><div id="app" class="app hidden"><aside class="chats"><header class="top"><div class="profile"><div class="avatar green">C</div><div><strong>Conecta</strong><small>Mensagens</small></div></div><div class="tools"><button class="icon" onclick="newChat()">＋</button><button class="icon" onclick="logout()">⇥</button></div></header><div class="search">⌕ <input id="search" placeholder="Pesquisar conversa" oninput="renderChats()"></div><div id="chatList" class="chat-list"></div><div class="account" id="account"></div></aside><main class="conversation"><header class="conversation-top"><button class="icon back" onclick="closeChat()">‹</button><div id="activeAvatar" class="avatar blue">?</div><div class="profile"><strong id="activeName">Escolha uma conversa</strong><small id="activeStatus">—</small></div><div class="tools"><button class="icon" onclick="startRecording()">♩</button><button class="icon" onclick="toast('Opções da conversa')">⋮</button></div></header><section id="messages" class="messages"><div class="empty">Crie uma conversa para começar.</div></section><footer class="composer"><input id="fileInput" type="file" hidden accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx"><button class="icon" onclick="document.getElementById('fileInput').click()">＋</button><input id="message" placeholder="Digite uma mensagem" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></footer></main></div><div id="toast" class="toast"></div><script>
let mode='login',token=localStorage.getItem('conecta_token')||'',me=null,chats=[],active=null,ws=null;const q=id=>document.getElementById(id),api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})};const r=await fetch(path,opt),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Não foi possível concluir');return x};function toggleAuth(){q('name').classList.toggle('hidden',mode==='login');q('loginTab').classList.toggle('active',mode==='login');q('registerTab').classList.toggle('active',mode==='register');q('authButton').textContent=mode==='login'?'Entrar':'Criar conta';q('error').textContent=''}async function auth(){try{const x=await api('/api/'+mode,{method:'POST',body:JSON.stringify({name:q('name').value,username:q('username').value,password:q('password').value})});token=x.token;me=x.user;localStorage.setItem('conecta_token',token);start()}catch(e){q('error').textContent=e.message}}async function start(){try{if(!me)me=(await api('/api/me')).user; q('login').classList.add('hidden');q('app').classList.remove('hidden');q('account').textContent=me.name+' · @'+me.username;await loadChats();connect()}catch(e){logout()}}async function loadChats(){chats=(await api('/api/chats')).chats;renderChats()}function renderChats(){const s=(q('search').value||'').toLowerCase();q('chatList').innerHTML=chats.filter(c=>c.name.toLowerCase().includes(s)).map(c=>{const last=c.last;return`<div class="chat-item ${active&&c.id===active.id?'active':''}" onclick="openChat('${c.id}')"><div class="avatar blue">${c.name[0]}</div><div class="copy"><div class="line"><strong>${esc(c.name)}</strong><time>${last?new Date(last.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''}</time></div><span class="preview">${last?esc(last.text):'Nova conversa'}</span></div></div>`}).join('')||'<div class="empty">Nenhuma conversa.<br>Use ＋ para procurar uma pessoa.</div>'}function mediaHtml(m){if(!m.mediaUrl)return '';const u=esc(m.mediaUrl),name=esc(m.fileName||'arquivo');if((m.mediaType||'').startsWith('image/'))return '<br><img src="'+u+'" alt="'+name+'" style="max-width:240px;max-height:260px;border-radius:8px;margin-top:6px">';if((m.mediaType||'').startsWith('video/'))return '<br><video src="'+u+'" controls style="max-width:250px;border-radius:8px;margin-top:6px"></video>';if((m.mediaType||'').startsWith('audio/'))return '<br><audio src="'+u+'" controls style="max-width:250px;margin-top:6px"></audio>';return '<br><a href="'+u+'" target="_blank" rel="noopener">📎 '+name+'</a>'}async function uploadMedia(file){const f=new FormData();f.append('file',file);const r=await fetch('/api/upload',{method:'POST',headers:{authorization:'Bearer '+token},body:f});const x=await r.json();if(!r.ok)throw Error(x.error||'Falha no upload');return x}async function pickFile(e){const file=e.target.files?.[0];if(!file)return;try{const media=await uploadMedia(file);await api('/api/chats/'+active.id+'/messages',{method:'POST',body:JSON.stringify(media)});toast('Arquivo enviado')}catch(err){toast(err.message)}e.target.value=''}async function startRecording(){if(window._rec&&window._rec.state==='recording'){window._rec.stop();window._rec=null;return}if(!active)return toast('Escolha uma conversa primeiro.');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Gravação não suportada neste navegador.');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),rec=new MediaRecorder(stream),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());try{const media=await uploadMedia(new File([new Blob(chunks,{type:rec.mimeType||'audio/webm'})],'audio-'+Date.now()+'.webm',{type:rec.mimeType||'audio/webm'}));await api('/api/chats/'+active.id+'/messages',{method:'POST',body:JSON.stringify(media)});toast('Áudio enviado')}catch(err){toast(err.message)}};rec.start();toast('Gravando áudio… toque novamente no botão para parar.');window._rec=rec}catch(e){toast('Permita o acesso ao microfone.')}}async function openChat(id){active=chats.find(c=>c.id===id);if(!active)return;renderChats();q('activeName').textContent=active.name;q('activeAvatar').textContent=active.name[0];const x=await api('/api/chats/'+id+'/messages');q('messages').innerHTML='<div class="day">HOJE</div>'+((x.messages||[]).map(m=>`<div class="msg ${m.senderId===me.id?'out':''}">${esc(m.text)}${mediaHtml(m)}<span class="meta">${new Date(m.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<div class="empty">Nenhuma mensagem ainda.</div>');q('messages').scrollTop=q('messages').scrollHeight;q('app').classList.add('open-chat')}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/?token='+encodeURIComponent(token));ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='message'&&active&&x.message.chatId===active.id){const m=x.message,el=document.createElement('div');el.className='msg '+(m.senderId===me.id?'out':'');el.innerHTML=esc(m.text)+mediaHtml(m)+'<span class="meta">'+new Date(m.createdAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</span>';q('messages').appendChild(el);q('messages').scrollTop=q('messages').scrollHeight;loadChats()}}}async function send(){const input=q('message'),text=input.value.trim();if(!text||!active)return toast('Escolha uma conversa primeiro.');input.value='';try{await api('/api/chats/'+active.id+'/messages',{method:'POST',body:JSON.stringify({text})})}catch(e){toast(e.message)}}async function newChat(){const query=prompt('Digite o usuário da pessoa que você quer encontrar:');if(!query)return;try{const x=await api('/api/users?q='+encodeURIComponent(query));if(!x.users.length)return toast('Nenhum usuário encontrado.');const user=x.users[0],c=await api('/api/chats',{method:'POST',body:JSON.stringify({userId:user.id})});await loadChats();openChat(c.chat.id)}catch(e){toast(e.message)}}function closeChat(){q('app').classList.remove('open-chat')}function logout(){localStorage.removeItem('conecta_token');location.reload()}function toast(t){const e=q('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.getElementById('fileInput').addEventListener('change',pickFile);toggleAuth();if(token)start();
</script></body></html>
